/* =========================================
   FALLBACK IMAGE
========================================= */

const fallbackImage =
"https://via.placeholder.com/600x400?text=Game";


/* =========================================
   CREATE DOWNLOAD LINK
========================================= */

function getDownloadLink(game) {

  const query = encodeURIComponent(game.search);

  if (game.price === "free") {

    return "https://apkpure.net/search?q=" + query;

  }

  return "https://play.google.com/store/search?q=" +
         query +
         "&c=apps&hl=en";

}


/* =========================================
   GET REAL GAME IMAGE
   iTunes / App Store artwork API
========================================= */

async function getGameImage(game) {

  try {

    const query = encodeURIComponent(game.search);

    const response = await fetch(
      "https://itunes.apple.com/search?term=" +
      query +
      "&entity=software&limit=5"
    );

    const data = await response.json();

    if (data.results && data.results.length > 0) {

      let result = data.results.find(item => {

        const name =
          (item.trackName || "").toLowerCase();

        return name.includes(
          game.name
            .replace(":", "")
            .replace("–", "")
            .toLowerCase()
            .split(" ")[0]
        );

      });

      if (!result) {
        result = data.results[0];
      }

      if (result.artworkUrl512) {

        return result.artworkUrl512
          .replace("100x100", "512x512");

      }

      if (result.artworkUrl100) {

        return result.artworkUrl100
          .replace("100x100", "512x512");

      }

    }

  } catch (error) {

    console.log(
      "Image error:",
      game.name
    );

  }

  return fallbackImage;
}


/* =========================================
   CREATE GAME CARD
========================================= */

async function createGameCard(game, index) {

  const image = await getGameImage(game);

  const card = document.createElement("article");

  card.className = "game-card";

  card.dataset.genre = game.genre;
  card.dataset.price = game.price;
  card.dataset.name = game.name.toLowerCase();

  card.innerHTML = `

    <img
      class="game-image"
      src="${image}"
      alt="${game.name} game"
      loading="${index < 12 ? "eager" : "lazy"}"
      onerror="this.src='${fallbackImage}'"
    >

    <div class="game-content">

      <div class="game-title">
        ${game.name}
      </div>

      <div class="game-meta">

        <span class="game-tag">
          ${game.genre}
        </span>

        <span class="game-tag ${
          game.price === "free"
          ? "game-free"
          : "game-paid"
        }">

          ${
            game.price === "free"
            ? "FREE"
            : "PAID"
          }

        </span>

      </div>

      <div class="game-description">
        ${game.description}
      </div>

      <a
        class="download-btn"
        href="${getDownloadLink(game)}"
        target="_blank"
        rel="noopener noreferrer"
      >
        ⬇️ Download
      </a>

    </div>

  `;

  return card;
}


/* =========================================
   RENDER ALL GAMES
========================================= */

async function renderGames(list = games) {

  const grid =
    document.getElementById("gamesGrid");

  grid.innerHTML =
    '<div class="loading-games">🎮 Loading games...</div>';

  const fragment =
    document.createDocumentFragment();

  for (let i = 0; i < list.length; i++) {

    const card =
      await createGameCard(list[i], i);

    fragment.appendChild(card);

  }

  grid.innerHTML = "";

  grid.appendChild(fragment);

  document.getElementById("gamesCount")
    .textContent = list.length;

}


/* =========================================
   SEARCH + FILTER
========================================= */

function filterGames() {

  const search =
    document
      .getElementById("gameSearch")
      .value
      .toLowerCase()
      .trim();

  const genre =
    document
      .getElementById("genreFilter")
      .value;

  const price =
    document
      .getElementById("priceFilter")
      .value;

  const filtered =
    games.filter(game => {

      const matchesSearch =
        game.name
          .toLowerCase()
          .includes(search);

      const matchesGenre =
        genre === "all" ||
        game.genre === genre;

      const matchesPrice =
        price === "all" ||
        game.price === price;

      return (
        matchesSearch &&
        matchesGenre &&
        matchesPrice
      );

    });

  renderGames(filtered);

}


/* =========================================
   EVENTS
========================================= */

document
  .getElementById("gameSearch")
  .addEventListener(
    "input",
    filterGames
  );

document
  .getElementById("genreFilter")
  .addEventListener(
    "change",
    filterGames
  );

document
  .getElementById("priceFilter")
  .addEventListener(
    "change",
    filterGames
  );


/* =========================================
   START
========================================= */

renderGames(games);

</script>
